[package]
name = "forest-fire-risk-rs"
version = "0.1.0"
edition = "2021"
authors = ["Yevhenii Khan <khan@nubip.edu.ua>"]
description = "Risk-oriented framework for enhancing forest resilience to wildfires using remote sensing data"
license = "MIT"
repository = "https://github.com/yevheniikhan/forest-fire-risk-rs"

[dependencies]
# GUI
eframe = "0.30"
egui = "0.30"
egui_extras = { version = "0.30", features = ["image"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# GeoJSON and spatial
geojson = "0.24"
geo = "0.28"
geo-types = "0.7"

# KML/KMZ parsing
kml = "0.8"
zip = "2.2"

# Shapefile parsing
shapefile = "0.6"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# File dialogs
rfd = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# URL handling
url = "2.5"

# UUID for unique identifiers
uuid = { version = "1.11", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
